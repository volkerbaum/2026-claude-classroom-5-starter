name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Nothing here calls a model, so the OpenRouter key is a placeholder and
      # the auth secret only has to live as long as the run.
      - name: Write .env
        run: |
          cat > .env <<ENV
          DATABASE_URL=file:./data/app.db
          OPENROUTER_API_KEY=sk-or-v1-ci-placeholder
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          BETTER_AUTH_URL=http://localhost:3000
          ENV

      - run: npm run db:migrate

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # The config's `list` reporter writes nothing to disk, so add `html` for
      # the artifact; *.llm.spec.ts stays skipped because E2E_LLM is unset.
      - run: npx playwright test --reporter=list,html

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
